<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stadium Striker - Football Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="floodlights">
    <div class="light left"></div>
    <div class="light right"></div>
  </div>

  <div class="stadium">
    <div class="stand top"></div>

    <div class="scoreboard">
      <div class="sb-box">
        <span class="sb-label">GOALS</span>
        <span id="score">0</span>
      </div>
      <div class="sb-title">STADIUM STRIKER</div>
      <div class="sb-box">
        <span class="sb-label">TIME</span>
        <span id="time">90</span>
      </div>
    </div>

    <div class="stands-side">
      <div class="stand left"></div>

      <div class="field-wrap">
        <canvas id="game" width="480" height="760"></canvas>
        <div id="message" class="message hidden"></div>
      </div>

      <div class="stand right"></div>
    </div>

    <div class="stand bottom"></div>
  </div>

  <div class="controls-panel">
    <div class="dpad">
      <button class="dbtn up" data-dir="up">▲</button>
      <div class="dpad-row">
        <button class="dbtn left" data-dir="left">◀</button>
        <button class="dbtn down" data-dir="down">▼</button>
        <button class="dbtn right" data-dir="right">▶</button>
      </div>
    </div>
    <button id="kickBtn" class="kick-btn">KICK</button>
  </div>

  <p class="hint">Desktop: Arrow keys / WASD to move, hold Space to charge shot &nbsp;|&nbsp; Mobile: use the pad and hold KICK</p>
  <button id="restartBtn" class="restart-btn hidden">Restart Match</button>

<script src="script.js"></script>
</body>
</html>
