<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stadium Striker - Football Game</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>

  <div class="floodlights">
    <div class="light left"></div>
    <div class="light right"></div>
  </div>

  <div class="stadium">
    <div class="stand top"></div>

    <!-- ===== LOBBY ===== -->
    <section id="lobbyScreen" class="panel">
      <h1 class="brand">STADIUM STRIKER</h1>
      <p class="subtitle">Enter your name, then create a room or join a friend's.</p>

      <input id="playerNameInput" class="text-input" maxlength="20" placeholder="Your name">

      <div class="lobby-actions">
        <div class="room-form">
          <p class="form-label">Create a room</p>
          <input id="createRoomNameInput" class="text-input" maxlength="20" placeholder="Room name">
          <input id="createRoomPassInput" class="text-input" type="password" maxlength="30" placeholder="Room password">
          <button id="createRoomBtn" class="primary-btn">Create Room</button>
        </div>

        <div class="room-form">
          <p class="form-label">Join a room</p>
          <input id="joinRoomNameInput" class="text-input" maxlength="20" placeholder="Room name">
          <input id="joinRoomPassInput" class="text-input" type="password" maxlength="30" placeholder="Room password">
          <button id="joinRoomBtn" class="primary-btn">Join Room</button>
        </div>

        <button id="practiceFromLobbyBtn" class="secondary-btn">Play Practice Mode</button>
      </div>

      <div id="waitingBox" class="waiting-box hidden">
        <p id="waitingText">Waiting for opponent to join…</p>
        <button id="cancelWaitBtn" class="link-btn">Cancel</button>
      </div>
      <p id="lobbyError" class="error-text hidden"></p>
    </section>

    <!-- ===== SCOREBOARD (shared by both modes) ===== -->
    <div id="scoreboardWrap" class="hidden">
      <div class="scoreboard">
        <div class="sb-box">
          <span class="sb-label" id="sbLeftLabel">GOALS</span>
          <span id="score">0</span>
        </div>
        <div class="sb-title" id="sbTitle">STADIUM STRIKER</div>
        <div class="sb-box">
          <span class="sb-label" id="sbRightLabel">TIME</span>
          <span id="time">90</span>
        </div>
      </div>
      <div id="turnBanner" class="turn-banner hidden"></div>
    </div>

    <div class="stands-side">
      <div class="stand left"></div>

      <div class="field-wrap">
        <canvas id="game" width="480" height="760" class="hidden"></canvas>
        <div id="zoneOverlay" class="zone-overlay hidden"></div>
        <div id="message" class="message hidden"></div>
      </div>

      <div class="stand right"></div>
    </div>

    <div class="stand bottom"></div>
  </div>

  <div id="controlsPanel" class="controls-panel hidden">
    <div class="dpad">
      <button class="dbtn up" data-dir="up">▲</button>
      <div class="dpad-row">
        <button class="dbtn left" data-dir="left">◀</button>
        <button class="dbtn down" data-dir="down">▼</button>
        <button class="dbtn right" data-dir="right">▶</button>
      </div>
    </div>
    <button id="kickBtn" class="kick-btn">KICK</button>
  </div>

  <p id="hintText" class="hint hidden"></p>
  <button id="restartBtn" class="restart-btn hidden">Restart Match</button>
  <button id="rematchBtn" class="restart-btn hidden">Rematch</button>
  <button id="backToLobbyBtn" class="link-btn hidden">Back to Lobby</button>

<script src="lobby.js"></script>
<script src="multiplayer.js"></script>
<script src="script.js"></script>
</body>
</html>
